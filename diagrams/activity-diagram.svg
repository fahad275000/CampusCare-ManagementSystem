<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 940" width="1240" height="940" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b" />
    </marker>
    <marker id="arrowWarn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b45309" />
    </marker>
    <filter id="boxShadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1240" height="940" fill="#ffffff" />

  <!-- Title -->
  <text x="620" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">CampusCare — UML Activity Diagram (Complaint Lifecycle)</text>
  <text x="620" y="54" text-anchor="middle" font-size="13" fill="#475569">Swimlane Workflow with Validation Corrections and Administrator Review Decisions</text>

  <!-- =========================================================
       UML SWIMLANES (4 Partitions)
  ========================================================== -->
  <g stroke="#cbd5e1" stroke-width="1.5">
    <rect x="40" y="72" width="290" height="815" fill="#f8fafc" />
    <rect x="330" y="72" width="290" height="815" fill="#ffffff" />
    <rect x="620" y="72" width="290" height="815" fill="#f8fafc" />
    <rect x="910" y="72" width="290" height="815" fill="#ffffff" />
  </g>

  <!-- Swimlane Headers -->
  <g font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">
    <rect x="40" y="72" width="290" height="36" fill="#1e3a8a" />
    <text x="185" y="95">Student</text>

    <rect x="330" y="72" width="290" height="36" fill="#0f172a" />
    <text x="475" y="95">CampusCare System</text>

    <rect x="620" y="72" width="290" height="36" fill="#1d4ed8" />
    <text x="765" y="95">Administrator</text>

    <rect x="910" y="72" width="290" height="36" fill="#0e7490" />
    <text x="1055" y="95">Maintenance Staff</text>
  </g>

  <!-- =========================================================
       START & END UML NODES
  ========================================================== -->
  <!-- Initial Node (Filled Circle) -->
  <circle cx="185" cy="134" r="11" fill="#0f172a" />
  <text x="208" y="138" font-size="11.5" font-weight="600" fill="#334155">Start</text>

  <!-- Activity Final Node (Bullseye) -->
  <circle cx="185" cy="856" r="13" fill="#ffffff" stroke="#0f172a" stroke-width="2.2" />
  <circle cx="185" cy="856" r="7.5" fill="#0f172a" />
  <text x="208" y="860" font-size="11.5" font-weight="600" fill="#334155">End</text>

  <!-- =========================================================
       ACTIVITY ACTION NODES (Rounded Rectangles)
  ========================================================== -->
  <g filter="url(#boxShadow)" stroke-width="1.8">
    <!-- Student Actions -->
    <rect x="95" y="166" width="180" height="40" rx="14" fill="#eff6ff" stroke="#1d4ed8" />
    <rect x="95" y="228" width="180" height="40" rx="14" fill="#eff6ff" stroke="#1d4ed8" />
    <rect x="95" y="290" width="180" height="44" rx="14" fill="#eff6ff" stroke="#1d4ed8" />
    <rect x="95" y="362" width="180" height="40" rx="14" fill="#eff6ff" stroke="#1d4ed8" />
    <rect x="85" y="458" width="200" height="44" rx="14" fill="#fffbeb" stroke="#b45309" />
    <rect x="95" y="776" width="180" height="44" rx="14" fill="#ecfdf5" stroke="#059669" />

    <!-- System Actions -->
    <rect x="380" y="458" width="190" height="48" rx="14" fill="#f1f5f9" stroke="#334155" />
    <rect x="380" y="690" width="190" height="48" rx="14" fill="#f1f5f9" stroke="#334155" />

    <!-- Administrator Actions -->
    <rect x="675" y="462" width="180" height="40" rx="14" fill="#eff6ff" stroke="#1d4ed8" />
    <rect x="665" y="618" width="200" height="46" rx="14" fill="#eff6ff" stroke="#1d4ed8" />
    <rect x="665" y="704" width="200" height="46" rx="14" fill="#fffbeb" stroke="#b45309" />

    <!-- Maintenance Staff Actions -->
    <rect x="965" y="620" width="180" height="42" rx="14" fill="#ecfeff" stroke="#0e7490" />
    <rect x="965" y="690" width="180" height="42" rx="14" fill="#ecfeff" stroke="#0e7490" />
  </g>

  <!-- Action Node Labels -->
  <g font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle" dominant-baseline="middle">
    <text x="185" y="186">Student Login</text>
    <text x="185" y="248">Open Complaint Form</text>
    <text x="185" y="306">Enter Details</text>
    <text x="185" y="322" font-size="10.5" font-weight="500" fill="#475569">(Title, Category, Desc, Image)</text>
    <text x="185" y="382">Submit Complaint</text>

    <text x="185" y="474" fill="#92400e">Show Validation Errors</text>
    <text x="185" y="490" font-size="10.5" font-weight="500" fill="#92400e">&amp; Correct Form Input</text>

    <text x="185" y="792" fill="#065f46">Student Views Status</text>
    <text x="185" y="808" font-size="10.5" font-weight="500" fill="#065f46">(Staff &amp; Resolution Notes)</text>

    <text x="475" y="475">Save Complaint</text>
    <text x="475" y="492" font-size="10.5" font-weight="500" fill="#475569">(Auto ID, Status: Pending)</text>

    <text x="475" y="707">Update Status</text>
    <text x="475" y="724" font-size="10.5" font-weight="500" fill="#475569">(In Progress &#8594; Resolved)</text>

    <text x="765" y="482">Admin Review</text>
    <text x="765" y="635">Set Priority &amp; Assign Staff</text>
    <text x="765" y="651" font-size="10.5" font-weight="500" fill="#475569">(Status: Assigned)</text>

    <text x="765" y="721" fill="#92400e">Flag Invalid / Add Note</text>
    <text x="765" y="737" font-size="10.5" font-weight="500" fill="#92400e">&amp; Close / Request Correction</text>

    <text x="1055" y="641">Staff Views Complaint</text>
    <text x="1055" y="711">Resolve Issue</text>
  </g>

  <!-- =========================================================
       DECISION & MERGE DIAMONDS
  ========================================================== -->
  <!-- Decision 1: Form Input Valid? (System Column) -->
  <polygon points="475,356 508,382 475,408 442,382" fill="#fef3c7" stroke="#b45309" stroke-width="2" />
  <text x="475" y="346" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">Form Valid?</text>

  <!-- Decision 2: Complaint Valid? (Admin Column) -->
  <polygon points="765,530 798,556 765,582 732,556" fill="#fef3c7" stroke="#b45309" stroke-width="2" />
  <text x="716" y="544" text-anchor="end" font-size="11.5" font-weight="700" fill="#0f172a">Valid?</text>

  <!-- Merge Diamond before Student Views Status -->
  <polygon points="355,774 377,798 355,822 333,798" fill="#e2e8f0" stroke="#334155" stroke-width="1.8" />

  <!-- =========================================================
       CONTROL FLOW TRANSITIONS & GUARD CONDITIONS
  ========================================================== -->
  <g stroke="#1e293b" stroke-width="1.8" fill="none" marker-end="url(#arrow)">
    <!-- Start -> Login -> Open Form -> Enter Details -> Submit -->
    <line x1="185" y1="145" x2="185" y2="164" />
    <line x1="185" y1="206" x2="185" y2="226" />
    <line x1="185" y1="268" x2="185" y2="288" />
    <line x1="185" y1="334" x2="185" y2="360" />

    <!-- Submit -> Decision (Form Valid?) -->
    <line x1="275" y1="382" x2="439" y2="382" />

    <!-- [Valid] -> Save Complaint -->
    <line x1="475" y1="408" x2="475" y2="455" />

    <!-- Save Complaint -> Admin Review -->
    <line x1="570" y1="482" x2="672" y2="482" />

    <!-- Admin Review -> Decision (Valid?) -->
    <line x1="765" y1="502" x2="765" y2="527" />

    <!-- [Valid] -> Assign Staff -->
    <line x1="765" y1="582" x2="765" y2="615" />

    <!-- Assign Staff -> Staff Views Complaint -->
    <line x1="865" y1="641" x2="962" y2="641" />

    <!-- Staff Views Complaint -> Resolve Issue -->
    <line x1="1055" y1="662" x2="1055" y2="687" />

    <!-- Resolve Issue -> Update Status (System) -->
    <line x1="965" y1="711" x2="573" y2="711" />

    <!-- Update Status -> Merge -> Student Views Status -> End -->
    <path d="M 475 738 L 475 798 L 380 798" />
    <line x1="333" y1="798" x2="278" y2="798" />
    <line x1="185" y1="820" x2="185" y2="841" />
  </g>

  <!-- Alternative / Correction Paths (Highlighted Amber-Brown) -->
  <g stroke="#b45309" stroke-width="1.8" fill="none" stroke-dasharray="5 3" marker-end="url(#arrowWarn)">
    <!-- Form Invalid -> Correction -> Loop back to Enter Details -->
    <path d="M 442 390 L 348 390 L 348 480 L 288 480" />
    <path d="M 85 480 L 60 480 L 60 312 L 92 312" />

    <!-- Admin Decision [Invalid] -> Flag Invalid & Close / Request Correction -> Merge -->
    <path d="M 798 556 L 885 556 L 885 727 L 868 727" />
    <path d="M 665 742 L 665 814 L 368 814 L 362 810" />
  </g>

  <!-- Guard Labels -->
  <g font-size="11" font-weight="700">
    <rect x="482" y="418" width="50" height="18" rx="4" fill="#ecfdf5" />
    <text x="507" y="431" text-anchor="middle" fill="#047857">[Valid]</text>

    <rect x="302" y="405" width="60" height="18" rx="4" fill="#fffbeb" />
    <text x="332" y="418" text-anchor="middle" fill="#b45309">[Invalid]</text>

    <rect x="772" y="588" width="50" height="18" rx="4" fill="#ecfdf5" />
    <text x="797" y="601" text-anchor="middle" fill="#047857">[Valid]</text>

    <rect x="812" y="534" width="66" height="18" rx="4" fill="#fffbeb" />
    <text x="845" y="547" text-anchor="middle" fill="#b45309">[Invalid]</text>

    <text x="520" y="832" text-anchor="middle" font-size="10.5" fill="#b45309">Alternative Status / Correction Path</text>
  </g>

  <!-- Footer Legend -->
  <g transform="translate(40, 905)" font-size="11.5" fill="#475569">
    <text x="0" y="14">UML 2.5 Activity Notation: Filled Circle = Initial Start &#8226; Bullseye = Activity Final &#8226; Rounded Box = Action &#8226; Diamond = Decision / Merge &#8226; Dashed Line = Alternative Correction Path</text>
  </g>
</svg>
