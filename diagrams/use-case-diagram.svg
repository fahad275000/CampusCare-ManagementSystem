<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <filter id="cardShadow" x="-4%" y="-4%" width="108%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="820" fill="#ffffff" />

  <!-- Title Header -->
  <text x="600" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">CampusCare — UML Use Case Diagram</text>
  <text x="600" y="57" text-anchor="middle" font-size="13" fill="#475569">Smart Campus Complaint &amp; Maintenance Management System</text>

  <!-- System Boundary: CampusCare -->
  <rect x="295" y="78" width="610" height="690" rx="10" fill="#f8fafc" stroke="#1e293b" stroke-width="2.2" filter="url(#cardShadow)" />
  <rect x="295" y="78" width="610" height="36" rx="10" fill="#0f172a" />
  <rect x="295" y="102" width="610" height="12" fill="#0f172a" />
  <text x="600" y="102" text-anchor="middle" font-size="15" font-weight="700" fill="#f8fafc" letter-spacing="0.04em">CampusCare</text>

  <!-- =========================================================
       ACTOR: STUDENT (Left Upper)
  ========================================================== -->
  <g id="actor-student" transform="translate(170, 325)" stroke="#0f172a" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="0" cy="-34" r="15" fill="#eff6ff" stroke="#1d4ed8" />
    <line x1="0" y1="-19" x2="0" y2="18" />
    <line x1="-20" y1="-6" x2="20" y2="-6" />
    <line x1="0" y1="18" x2="-15" y2="45" />
    <line x1="0" y1="18" x2="15" y2="45" />
    <text x="0" y="67" text-anchor="middle" stroke="none" fill="#0f172a" font-size="14" font-weight="700">Student</text>
  </g>

  <!-- =========================================================
       ACTOR: MAINTENANCE STAFF (Left Lower)
  ========================================================== -->
  <g id="actor-staff" transform="translate(170, 645)" stroke="#0f172a" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="0" cy="-34" r="15" fill="#ecfeff" stroke="#0891b2" />
    <line x1="0" y1="-19" x2="0" y2="18" />
    <line x1="-20" y1="-6" x2="20" y2="-6" />
    <line x1="0" y1="18" x2="-15" y2="45" />
    <line x1="0" y1="18" x2="15" y2="45" />
    <text x="0" y="67" text-anchor="middle" stroke="none" fill="#0f172a" font-size="14" font-weight="700">Maintenance</text>
    <text x="0" y="84" text-anchor="middle" stroke="none" fill="#0f172a" font-size="14" font-weight="700">Staff</text>
  </g>

  <!-- =========================================================
       ACTOR: ADMINISTRATOR (Right)
  ========================================================== -->
  <g id="actor-admin" transform="translate(1030, 415)" stroke="#0f172a" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="0" cy="-34" r="15" fill="#eff6ff" stroke="#1e40af" />
    <line x1="0" y1="-19" x2="0" y2="18" />
    <line x1="-20" y1="-6" x2="20" y2="-6" />
    <line x1="0" y1="18" x2="-15" y2="45" />
    <line x1="0" y1="18" x2="15" y2="45" />
    <text x="0" y="67" text-anchor="middle" stroke="none" fill="#0f172a" font-size="14" font-weight="700">Administrator</text>
  </g>

  <!-- =========================================================
       ASSOCIATION LINES (Drawn before ovals so endpoints meet cleanly)
  ========================================================== -->
  <g stroke="#334155" stroke-width="1.8" fill="none">
    <!-- Student Associations -->
    <line x1="192" y1="312" x2="495" y2="160" />
    <line x1="192" y1="316" x2="480" y2="225" />
    <line x1="194" y1="322" x2="352" y2="302" />
    <line x1="194" y1="330" x2="352" y2="375" />
    <line x1="192" y1="338" x2="465" y2="450" />

    <!-- Administrator Associations -->
    <line x1="1008" y1="398" x2="705" y2="160" />
    <line x1="1008" y1="404" x2="720" y2="225" />
    <line x1="1006" y1="410" x2="848" y2="302" />
    <line x1="1006" y1="415" x2="840" y2="375" />
    <line x1="1006" y1="420" x2="735" y2="450" />
    <line x1="1006" y1="426" x2="848" y2="528" />
    <line x1="1008" y1="434" x2="788" y2="695" />

    <!-- Maintenance Staff Associations -->
    <!-- Outer left corridor routes cleanly to Login & View Dashboard without crossing Student -->
    <path d="M 146 635 C 38 560, 38 160, 495 160" />
    <path d="M 146 642 C 62 565, 62 225, 480 225" />
    <line x1="194" y1="635" x2="342" y2="612" />
    <line x1="194" y1="646" x2="512" y2="695" />
  </g>

  <!-- =========================================================
       USE CASE OVALS (All 10 Mandatory Use Cases)
  ========================================================== -->
  <g stroke="#1e40af" stroke-width="1.8" fill="#ffffff" filter="url(#cardShadow)">
    <ellipse cx="600" cy="160" rx="108" ry="26" fill="#eff6ff" />
    <ellipse cx="600" cy="225" rx="122" ry="26" fill="#eff6ff" />

    <ellipse cx="462" cy="302" rx="112" ry="26" />
    <ellipse cx="462" cy="375" rx="112" ry="26" />
    <ellipse cx="600" cy="450" rx="136" ry="26" fill="#f0f9ff" />

    <ellipse cx="738" cy="302" rx="112" ry="26" />
    <ellipse cx="738" cy="375" rx="104" ry="26" />
    <ellipse cx="738" cy="528" rx="112" ry="26" />

    <ellipse cx="472" cy="612" rx="132" ry="26" fill="#ecfeff" stroke="#0e7490" />
    <ellipse cx="650" cy="695" rx="140" ry="26" fill="#ecfeff" stroke="#0e7490" />
  </g>

  <!-- Use Case Labels -->
  <g font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle" dominant-baseline="middle">
    <text x="600" y="160">Login</text>
    <text x="600" y="225">View Dashboard</text>

    <text x="462" y="302">Submit Complaint</text>
    <text x="462" y="375">Track Complaint</text>
    <text x="600" y="450">View Complaint History</text>

    <text x="738" y="302">View All Complaints</text>
    <text x="738" y="375">Set Priority</text>
    <text x="738" y="528">Assign Complaint</text>

    <text x="472" y="612">View Assigned Complaints</text>
    <text x="650" y="695">Update Complaint Status</text>
  </g>

  <!-- UML Diagram Footer Legend -->
  <g transform="translate(295, 782)" font-size="11.5" fill="#475569">
    <text x="0" y="14">UML 2.5 Notation: Stick figures = External Actors &#8226; Rectangle = System Boundary (CampusCare) &#8226; Ovals = Use Cases &#8226; Solid Lines = Associations</text>
  </g>
</svg>
